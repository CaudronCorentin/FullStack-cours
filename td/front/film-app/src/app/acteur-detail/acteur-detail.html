<a routerLink="/acteurs"> Retour à la liste des acteurs</a>

@if (erreur()){
  <p>{{erreur()}}</p>
}

@if(acteur(); as a) {
  <h1> {{a.prenom}} {{a.nom}}</h1>

  <h2>Films</h2>
  <ul>
    @for(f of films(); track f.id){
      <li>
        <a [routerLink]="['/films', f.id]">
          {{f.titre}}
        </a>
        <span> {{f.dateSortie | date:"dd/MM/yyyy"}}</span>
      </li>
    } @empty {
      <li>Aucun film</li>
    }
  </ul>
}
