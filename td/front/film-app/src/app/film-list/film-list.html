<a routerLink="/films/nouveau">Nouveau film</a>

@if (erreur()) {
  <p>{{ erreur() }}</p>
}

@if (films$() | async; as films) {
  <ul>
    @for (f of films; track f.id) {
      <app-film-card [film]="f" (supprimer)="onSupprimer($event)" />
    } @empty {
      <li>Aucun film enregistré</li>
    }
  </ul>
}
