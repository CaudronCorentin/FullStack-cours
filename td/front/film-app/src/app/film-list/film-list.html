<a routerLink="/films/nouveau">Nouveau film</a>

@if (erreur()) {
  <p>{{ erreur() }}</p>
}

@if (films$() | async; as films) {
  <h2>Films récents</h2>
  <ul>
    @for (f of recents(films); track f.id) {
      <app-film-card [film]="f" (supprimer)="onSupprimer($event)" />
    } @empty {
      <li>Aucun film récent</li>
    }
  </ul>

  <h2>Films anciens</h2>
  <ul>
    @for (f of anciens(films); track f.id) {
      <app-film-card [film]="f" (supprimer)="onSupprimer($event)" />
    } @empty {
      <li>Aucun film ancien</li>
    }
  </ul>
}
